name: CI

# Runs on every push to main / my-edits and on every pull request of this fork.
# Read-only: no secrets, no deployment, no write permissions.
on:
  push:
    branches: [main, my-edits]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ROOTIQ_MODE: sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Run the backend test suite
        working-directory: backend
        run: python -m pytest -q

  consistency:
    name: Knowledge base, training data and docs are in sync
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Vendor knowledge base validates (0 errors)
        working-directory: backend
        run: python -c "from app.knowledge import get_kb; e = get_kb().validate(); print(e); raise SystemExit(1 if e else 0)"
      - name: Generated training data matches the knowledge base
        run: python training/build_dataset.py --check
      - name: docs/VENDORS.md matches the knowledge base
        run: python scripts/gen_vendors_doc.py --check
      - name: Wiring audit (live API, doc numbers, notebook, GitHub files, frontend types)
        run: python scripts/audit_wiring.py

  frontend:
    name: Frontend (type-check, unit tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type-check
        run: npx tsc --noEmit
      - name: Unit tests
        run: npx vitest run src
      - name: Build
        run: npm run build
