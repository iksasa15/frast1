# Render / Railway — one public URL for RootIQ (UI + API + WS)
services:
  - type: web
    name: rootiq
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: INGEST_TOKEN
        sync: false
      - key: LAB_AGENT_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: TOPOLOGY_STATE_PATH
        value: /app/data/topology-observed.json
